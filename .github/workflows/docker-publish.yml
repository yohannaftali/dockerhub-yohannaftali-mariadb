name: Docker publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: yohannaftali/mariadb

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["latest", "11.4", "10.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: MARIADB_VERSION=${{ matrix.version }}
          tags: ${{ env.IMAGE }}:${{ matrix.version }}
          push: true

  description:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: yohannaftali/mariadb
          short-description: "MariaDB preconfigured with Asia/Jakarta (WIB) timezone, built on the official image."
          readme-filepath: ./README.md
